org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# Build-tool versions.
# Check https://fabricmc.net/develop/ for the current Loom release.
loom_version=1.11-SNAPSHOT

# Minecraft / Fabric versions.
# yarn_mappings and fabric_version must match minecraft_version exactly.
# Look the current build numbers up at https://fabricmc.net/develop/ or
# https://meta.fabricmc.net/v2/versions/yarn/1.26.2
minecraft_version=1.26.2
yarn_mappings=1.26.2+build.1
loader_version=0.19.5
fabric_version=0.135.0+1.26.2

# Mod metadata
mod_version=1.0.0
maven_group=com.pearlkeeper
archives_base_name=pearlkeeper
